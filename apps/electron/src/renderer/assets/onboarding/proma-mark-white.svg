<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Proma 标志 - 纯白无背景版（从官方 icon.svg 提取中间条纹图案，去掉黑色圆角背景） -->
  <g transform="translate(60 60) scale(0.7) translate(-60 -60)">
    <!-- 第一层 - 最近，最实 -->
    <rect x="20" y="42" width="34" height="48" rx="6" fill="#FFFFFF" opacity="1"/>

    <!-- 第二层 - 渐远 -->
    <rect x="44" y="39" width="30" height="44" rx="5" fill="#F2F2F2" opacity="0.92"
          transform="rotate(-3 59 61)"/>

    <!-- 第三层 - 更远 -->
    <rect x="66" y="36" width="27" height="40" rx="4" fill="#E8E8E8" opacity="0.82"
          transform="rotate(-6 79 56)"/>

    <!-- 第四层 - 渐隐 -->
    <rect x="86" y="33" width="23" height="36" rx="4" fill="#DFDFDF" opacity="0.7"
          transform="rotate(-9 97 51)"/>

    <!-- 第五层 - 远端 -->
    <rect x="104" y="30" width="20" height="32" rx="3" fill="#D6D6D6" opacity="0.55"
          transform="rotate(-12 114 46)"/>

    <!-- 第六层 - 几乎消失 -->
    <rect x="120" y="27" width="16" height="28" rx="3" fill="#CECECE" opacity="0.4"
          transform="rotate(-15 128 41)"/>
  </g>
</svg>
